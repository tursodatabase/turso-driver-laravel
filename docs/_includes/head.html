<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | truncate: 170 }}">
<meta name="theme-color" content="#0b0e08">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | truncate: 170 }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">

<!-- Favicons rendered from the turso-driver-laravel logo. One coloured mark serves
     both themes, so there is no per-theme favicon swap. -->
<link id="site-favicon" rel="icon" href="{{ '/favicon-32.png' | relative_url }}" type="image/png" sizes="32x32">
<link rel="shortcut icon" href="{{ '/favicon.ico' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
