# Turso Driver for Laravel — isolated proof of usage.
#
# Topology: proof.sh orchestrates everything; this file only declares the
# services:
#
#   curl (from inside the app container)
#        │
#        ▼
#   nginx :80 ──► app (php-fpm :9000) ──► sqld (libSQL server :8080)
#
# The app container shares a named volume with nginx so the web tier can
# serve /app/public. The volume is initialized from the image on first use
# and wiped by `proof.sh --teardown` (docker compose down -v).

name: turso-driver-proof

services:
  sqld:
    image: ghcr.io/tursodatabase/libsql-server:latest
    volumes:
      - sqld-data:/var/lib/sqld
    ports:
      - "${SQLD_PORT:-8081}:8080"

  app:
    build:
      context: ../..
      dockerfile: docker/proof/Dockerfile
      args:
        DRIVER_SOURCE: ${DRIVER_SOURCE:-path}
        DRIVER_VERSION: ${DRIVER_VERSION:-*}
    volumes:
      - app-data:/app
    # php-fpm serves :9000 (see Dockerfile CMD). The CLI SAPI in the same
    # image is what proof.sh execs into for the console proof phases.

  web:
    image: nginx:alpine
    depends_on:
      - app
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
      - app-data:/app:ro
    ports:
      - "${HTTP_PORT:-8080}:80"

volumes:
  sqld-data:
  app-data:
