name: Tests

on: ["push", "pull_request"]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      libsql:
        # Local sqld for the server-dependent test suite
        image: ghcr.io/tursodatabase/libsql-server:latest
        ports:
          - 8081:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          tools: composer:v2
          coverage: xdebug

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install libSQL
        run: |
          ./vendor/darkterminal/turso-php-installer/builds/turso-php-installer install -n --php-version=8.3

      - name: Tests
        env:
          TURSO_SQLD_AVAILABLE: true
        run: composer run test:parallel
