name: Tests

on: ["push", "pull_request"]

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    services:
      libsql:
        # Local sqld for the server-dependent test suite
        image: ghcr.io/tursodatabase/libsql-server:latest
        ports:
          - 8081:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: xdebug

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install libSQL
        run: |
          ./vendor/darkterminal/turso-php-installer/builds/turso-php-installer install -n --php-version=${{ matrix.php }}

      - name: Seed sqld (initialize WAL so embedded replicas can sync)
        run: |
          for i in $(seq 1 30); do
            if curl -sf -m 2 -X POST http://127.0.0.1:8081/v2/pipeline \
              -H 'Content-Type: application/json' \
              -d '{"requests":[{"type":"execute","stmt":{"sql":"CREATE TABLE IF NOT EXISTS _boot (id INTEGER PRIMARY KEY)"}},{"type":"close"}]}' > /dev/null 2>&1; then
              echo "sqld ready and seeded"
              exit 0
            fi
            sleep 1
          done
          echo "sqld did not become ready"
          exit 1

      - name: Tests
        env:
          TURSO_SQLD_AVAILABLE: true
        run: composer run test:parallel
